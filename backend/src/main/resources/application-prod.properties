# Production profile.
# No defaults on purpose: a missing environment variable must fail startup
# loudly instead of silently falling back to a dev database.

spring.docker.compose.enabled=false

# Either the whole JDBC URL (DATABASE_URL) or its parts (DATABASE_HOST, DATABASE_PORT, DATABASE_NAME), for hosts such
# as Render that hand out host, port, database, user and password separately. DATABASE_URL wins when both are set,
# and with neither the placeholder cannot be resolved, so startup still fails loudly.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.show-sql=false

app.upload.dir=${UPLOAD_DIR}

# The one deliberate default in this file: set SESSION_COOKIE_SECURE=true when the app is served over HTTPS,
# so the session cookie is never sent over plain HTTP. It defaults to false so that a deployment on plain HTTP
# (an internal network, say) can still sign in instead of failing silently.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
