spring.application.name=backend

# The port to listen on: a host such as Render sets PORT, everything else uses 8080.
server.port=${PORT:8080}

# Compress the app's scripts, styles and JSON (the frontend image's nginx does this when it is in front).
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml,application/manifest+json

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# The staff session cookie is the only credential after sign-in. HttpOnly keeps page scripts away from it;
# SameSite=Lax keeps the browser from sending it on cross-site POST/PUT/PATCH/DELETE, which is what stands in
# for CSRF tokens (the API is same-origin and JSON-only).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Seed the demo data on startup. Off by default; the dev profile turns it on, a deployment can with APP_SEED_DEMO=true.
app.seed.demo=false
