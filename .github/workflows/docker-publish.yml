# Builds the Docker images and publishes them to Docker Hub: backend and frontend (docker-compose.yml), and app, the
# single image with both in one (Dockerfile.combined) that the Render deployment runs.
#
#   - a version tag (v1.2.3) pushes  1.2.3, 1.2 and latest   (a pre-release tag such as v1.0.0-rc.1 gets no "latest")
#   - a push to master pushes        edge
#   - a pull request only BUILDS the images (to catch a broken Dockerfile): it never pushes and needs no secrets
#
# Needs two repository secrets (Settings > Secrets and variables > Actions): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with Read & Write). Without them the images are still built, just not pushed.
# See Documentation/deployment.md ("Publishing a release").
name: Docker images

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile.combined*'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

env:
  # The one place that names the images: <DOCKERHUB_NAMESPACE>/<IMAGE_PREFIX>-backend and -frontend.
  # docker-compose.hub.yml and Documentation/deployment.md use the same names.
  DOCKERHUB_NAMESPACE: osamasado2024
  IMAGE_PREFIX: restaurant-orders

jobs:
  images:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          # The context is the repository root: the Dockerfile copies the frontend build into the backend jar.
          - image: app
            context: .
            dockerfile: ./Dockerfile.combined
    env:
      # Push only from master and tags, and only when the credentials exist.
      CAN_PUSH: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to Docker Hub
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (to make the arm64 image on an amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Work out the tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=master
            type=ref,event=pr

      - name: Build${{ env.CAN_PUSH == 'true' && ' and push' || '' }} the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # The combined image records its release in /version.txt, which the Render deployment checks.
          build-args: ${{ matrix.image == 'app' && format('APP_VERSION={0}', steps.meta.outputs.version) || '' }}
          # A pull request only checks that the image builds, so one architecture is enough there.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Keep the Docker Hub tag list clean: no extra "unknown/unknown" attestation entries.
          provenance: false
          sbom: false

      - name: Say why nothing was pushed
        if: env.CAN_PUSH != 'true' && github.event_name != 'pull_request'
        run: echo "::warning::The images were built but not pushed, because the DOCKERHUB_TOKEN secret is not set."
