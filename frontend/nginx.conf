# One origin for the browser: the single-page app, the API and the meal photos all come from this server, so the
# session cookie works and there is no CORS. The backend is reached by its compose service name.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend's address, so a restarted backend container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # nginx's default list does not know the web app manifest; installability wants application/manifest+json.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Meal and raw-material photos are limited to 5 MB by the backend; this leaves room for the multipart wrapping.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /images/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The build's hashed scripts and styles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and the page that loads the bundle must always be revalidated, or an update never arrives.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every screen (/guest, /kitchen, /hall, /admin/...) is the same single-page app: unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
